<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A3A24">
<title>Course Evaluation | Army Cadets Digital Training Centre</title>
<link rel="icon" href="acf-logo.png">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--dark:#0A3A24;--accent:#1E7A46;--tint:#E9F4EC;--ink:#25323b;--mut:#54616b;
  --line:#D8DEE8;--bg:#F5F8F6;--card:#fff;--bad:#C0563C;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Public Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
header{background:var(--dark);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
header img{height:34px;width:34px;border-radius:5px;background:#fff;object-fit:contain;padding:2px}
header b{font-size:.78rem;letter-spacing:.07em;display:block}
header span{font-size:.66rem;opacity:.78}
main{max-width:520px;margin:0 auto;padding:16px 14px 50px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h1{font-size:1.3rem;color:var(--dark);margin-bottom:4px}
.meta{font-size:.78rem;color:var(--mut)}
.meta b{color:var(--ink)}
label{display:block;font-size:.76rem;font-weight:700;color:var(--dark);margin:12px 0 4px}
label .opt{font-weight:500;color:var(--mut)}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px;
  font:inherit;font-size:1rem;background:#fff;color:var(--ink)}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:.72rem;color:var(--mut);margin-top:3px}
.check{display:flex;gap:9px;align-items:flex-start;margin-top:14px;font-size:.8rem;color:var(--mut)}
.check input{width:18px;height:18px;flex:0 0 auto;margin-top:2px}
#pad{width:100%;height:150px;border:1px dashed var(--line);border-radius:10px;touch-action:none;background:#fff}
.padrow{display:flex;justify-content:space-between;align-items:center;margin-top:5px}
.link{background:none;border:0;color:var(--accent);font:inherit;font-size:.76rem;font-weight:700;cursor:pointer;padding:0}
.btn{width:100%;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:14px;
  font:inherit;font-size:1rem;font-weight:700;cursor:pointer;margin-top:18px}
.btn:disabled{opacity:.55}
.msg{font-size:.8rem;margin-top:10px;color:var(--bad)}
.done{text-align:center;padding:26px 16px}
.done .tick{width:56px;height:56px;border-radius:50%;background:var(--tint);color:var(--accent);
  display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:1.7rem;font-weight:800}
.done h2{font-size:1.15rem;color:var(--dark);margin-bottom:6px}
.done p{font-size:.85rem;color:var(--mut)}
footer{text-align:center;font-size:.68rem;color:var(--mut);padding:0 14px 26px}
.load{text-align:center;color:var(--mut);font-size:.85rem;padding:40px 0}
.addneeds{width:100%;margin-top:4px;border:1.5px dashed var(--accent);background:var(--tint);color:var(--dark);border-radius:10px;padding:13px;font:inherit;font-size:.95rem;font-weight:700;cursor:pointer;text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--tint);color:var(--dark);border-radius:999px;padding:5px 11px;font-size:.78rem;font-weight:600}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,58,36,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:1.1rem;color:var(--dark)}
.sheet h3{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:16px 0 6px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt2{position:relative}.opt2 input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.opt2 span{display:inline-block;border:1.5px solid var(--line);border-radius:999px;padding:8px 13px;font-size:.86rem;font-weight:600;cursor:pointer;background:#fff}
.opt2 input:checked+span{background:var(--accent);border-color:var(--accent);color:#fff}
.opt2 input:focus-visible+span{outline:2px solid var(--dark);outline-offset:2px}
.sheetbar{position:sticky;bottom:-18px;background:#fff;padding-top:10px;display:flex;gap:8px}
.sheetbar .btn{margin-top:0}
.btn.ghost{background:#fff;color:var(--dark);border:1px solid var(--line);flex:0 0 32%}

.q{margin-top:16px}.q>b{display:block;font-size:.86rem;color:var(--dark);margin-bottom:6px}
.rate{display:grid;grid-template-columns:1fr repeat(5,40px);gap:4px;align-items:center;padding:7px 0;border-bottom:1px solid #EEF1F6;font-size:.86rem}
.rate.h{font-size:.66rem;color:var(--mut);font-weight:700;text-align:center;border:0;padding-bottom:0}.rate.h span:first-child{text-align:left}
.rate label{display:grid;place-items:center;margin:0}
.rate input{width:22px;height:22px;accent-color:var(--accent)}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pill{position:relative}.pill input{position:absolute;opacity:0;width:1px;height:1px}
.pill span{display:inline-block;border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.88rem;font-weight:600;cursor:pointer;background:#fff}
.pill input:checked+span{background:var(--accent);border-color:var(--accent);color:#fff}
.pill input:focus-visible+span{outline:2px solid var(--dark);outline-offset:2px}
textarea{margin-top:6px}
</style></head><body>
<header>
  <img src="acf-logo.png" alt="" onerror="this.style.display='none'">
  <div><b>ARMY CADETS</b><span>Digital Training Centre</span></div>
</header>
<main id="main"><div class="load">Loading…</div></main>
<footer>Your feedback goes to your course team and the Army Cadets training centre to improve future courses.</footer>
<script>
const SB = { url:'https://nyawiqngmlpklxqkuhbm.supabase.co', key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55YXdpcW5nbWxwa2x4cWt1aGJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNzAwNDgsImV4cCI6MjEwNTg0NjA0OH0.lCaVp0v3ZeXE82X97H_PJXs7TMzFIbwP9PmxGZXEaYU' };
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function rpc(fn, body) {
  const r = await fetch(SB.url + '/rest/v1/rpc/' + fn, { method:'POST', headers:{ 'Content-Type':'application/json', apikey:SB.key, Authorization:'Bearer ' + SB.key }, body: JSON.stringify(body) });
  const txt = await r.text(); let data = null; try { data = txt ? JSON.parse(txt) : null; } catch (e) { data = txt; }
  if (!r.ok) throw new Error((data && (data.message || data.hint)) || txt || ('HTTP ' + r.status));
  return data;
}
const fmtDate = d => { if (!d) return ''; const x = new Date(d); return isNaN(x) ? d : x.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }); };
// Exactly the questions on the Army Cadets Course Evaluation form
const RATE = [['delivery','Delivery'],['visual','Visual Aids'],['body','Body Language'],['participation','Audience Participation'],['knowledge','Subject Knowledge'],['techniques','Range of Techniques']];
const TEXTQ = [
  ['pace','How would you describe the pace of the course?',['Too fast','About right','Too slow']],
  ['covered','Did the course cover everything you expected it to?',['Yes','Partly','No']],
  ['improve','Are there any ways of improving the course?',null],
  ['confident','Do you feel more confident in carrying out your role following this course?',['Yes','Somewhat','No']],
  ['comfortable','Do you feel more comfortable with the subject matter?',['Yes','Somewhat','No']],
  ['skills','Have your skills improved during the course?',['Yes','Somewhat','No']],
  ['comments','Any other comments',null]];
async function boot() {
  const main = document.getElementById('main');
  if (!TOKEN) { main.innerHTML = '<div class="card"><h1>Link not valid</h1><p class="meta">This page needs the QR code from your instructor.</p></div>'; return; }
  let info;
  try { info = await rpc('acf_feedback_info', { p_token: TOKEN }); }
  catch (e) { main.innerHTML = `<div class="card"><h1>Couldn't open the feedback form</h1><p class="meta">${esc(e.message)}</p></div>`; return; }
  if (!info) { main.innerHTML = '<div class="card"><h1>This link has expired</h1><p class="meta">Ask your instructor for a new QR code.</p></div>'; return; }
  const names = (info.learners || []).filter(Boolean);
  main.innerHTML = `<div class="card"><h1>Course Evaluation</h1>
      <p class="meta"><b>${esc(info.course || 'First aid course')}</b>${info.start ? ' · ' + fmtDate(info.start) : ''}${info.instructor ? ' · Trainer: ' + esc(info.instructor) : ''}</p>
      <p class="meta" style="margin-top:6px">Thank you for taking part. Your honest feedback helps us improve our courses.</p></div>
    <div class="card">
      <label for="fName">Your name <span class="opt">(optional)</span></label>
      ${names.length ? `<select id="fName"><option value="">Prefer not to say</option>${names.map(n => `<option>${esc(n)}</option>`).join('')}</select>` : '<input id="fName" autocomplete="name">'}
      <div class="q"><b>On a scale of 1 (Poor) to 5 (Excellent), please rate your trainer according to:</b>
        <div class="rate h"><span></span>${[1,2,3,4,5].map(i => `<span>${i}</span>`).join('')}</div>
        ${RATE.map(([k, l]) => `<div class="rate" role="radiogroup" aria-label="${esc(l)}"><span>${esc(l)}</span>${[1,2,3,4,5].map(i => `<label><input type="radio" name="r_${k}" value="${i}" aria-label="${esc(l)} ${i}"></label>`).join('')}</div>`).join('')}
      </div>
      ${TEXTQ.map(([k, q, opts]) => `<div class="q"><b>${esc(q)}</b>
        ${opts ? `<div class="pills">${opts.map(o => `<label class="pill"><input type="radio" name="p_${k}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join('')}</div>` : ''}
        <textarea id="t_${k}" rows="${opts ? 2 : 3}" maxlength="1000" placeholder="${opts ? 'Add a comment (optional)' : ''}"></textarea></div>`).join('')}
      <button class="btn" id="go" onclick="send()">Send feedback</button>
      <div class="msg" id="msg"></div>
    </div>`;
}
async function send() {
  const msg = document.getElementById('msg'), go = document.getElementById('go');
  const acf = {};
  RATE.forEach(([k]) => { const x = document.querySelector(`input[name=r_${k}]:checked`); acf[k] = x ? +x.value : ''; });
  TEXTQ.forEach(([k, q, opts]) => { const p = opts && document.querySelector(`input[name=p_${k}]:checked`), t = (document.getElementById('t_' + k).value || '').trim();
    acf[k] = [p ? p.value : '', t].filter(Boolean).join(' – '); });
  if (!Object.values(acf).some(v => v !== '')) { msg.style.color = 'var(--bad)'; msg.textContent = 'Please answer at least one question.'; return; }
  const missing = RATE.filter(([k]) => acf[k] === '').length;
  if (missing && !confirm('You haven\u2019t rated ' + missing + ' of the trainer questions. Send anyway?')) return;
  msg.style.color = 'var(--mut)'; msg.textContent = 'Sending…'; go.disabled = true;
  try {
    await rpc('acf_feedback_submit', { p_token: TOKEN, p_data: { acf, name: (document.getElementById('fName').value || '').trim(), form: 'acf-course-evaluation-v1' } });
    document.getElementById('main').innerHTML = `<div class="card done"><div class="tick">✓</div><h2>Thank you</h2><p>Your feedback has been sent to your course team. You can close this page.</p></div>`;
    window.scrollTo(0, 0);
  } catch (e) { msg.style.color = 'var(--bad)'; msg.textContent = e.message || 'Could not send your feedback.'; go.disabled = false; }
}
boot();
</script>
</body></html>
